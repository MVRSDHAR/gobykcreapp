<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gobyk CRE Caller ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE2;
    --surface:#FFFFFF;
    --surface-soft:#FBF6EA;
    --text:#241C15;
    --text-soft:#6B6055;
    --border:#E7DCC7;
    --orange:#FF6B1A;
    --orange-soft:#FFE7D6;
    --green:#1F8A5C;
    --green-soft:#E1F3EA;
    --red:#C6432A;
    --red-soft:#FBE4DE;
    --amber:#B8860B;
    --amber-soft:#FBF0D9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:32px;}

  /* Header */
  header{
    display:flex;align-items:center;gap:12px;
    padding:18px 16px 14px;
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .logo-badge{
    width:44px;height:44px;border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:1px solid var(--border);
  }
  .brand-name{font-size:18px;font-weight:800;letter-spacing:0.2px;}
  .brand-sub{font-size:12px;color:var(--text-soft);font-weight:500;margin-top:1px;}

  /* Tabs */
  .tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:74px;z-index:9;}
  .tab{
    padding:12px 2px 10px;font-size:14px;font-weight:700;color:var(--text-soft);
    border-bottom:3px solid transparent;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;
    font-family:inherit;
  }
  .tab.active{color:var(--orange);border-bottom-color:var(--orange);}

  main{padding:16px;}
  .view{display:none;}
  .view.active{display:block;}

  /* Search */
  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  input[type=tel], input[type=text]{
    flex:1;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);font-size:15px;font-family:inherit;color:var(--text);
  }
  input:focus{outline:2px solid var(--orange);outline-offset:1px;}
  .btn{
    padding:13px 18px;border-radius:12px;border:none;font-weight:700;font-size:14px;
    cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:disabled{opacity:0.5;}
  .btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text);}
  .btn-block{width:100%;}

  .hint{font-size:12.5px;color:var(--text-soft);margin:0 0 16px;}
  .empty{text-align:center;color:var(--text-soft);font-size:14px;padding:40px 20px;}

  /* Customer card */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:14px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .cust-name{font-size:17px;font-weight:800;margin:0;}
  .cust-sub{font-size:13px;color:var(--text-soft);margin-top:2px;}
  .badge{
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap;
  }
  .badge-red{background:var(--red-soft);color:var(--red);}
  .badge-amber{background:var(--amber-soft);color:var(--amber);}
  .badge-green{background:var(--green-soft);color:var(--green);}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
  .info-item{background:var(--surface-soft);border-radius:10px;padding:9px 11px;}
  .info-label{font-size:10.5px;color:var(--text-soft);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
  .info-value{font-size:14px;font-weight:700;margin-top:2px;}

  .action-row{display:flex;gap:8px;margin-top:12px;}
  .action-row .btn{flex:1;}

  /* Call history */
  .history-title{font-size:12.5px;font-weight:700;color:var(--text-soft);margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.4px;}
  .history-item{border-left:2px solid var(--orange-soft);padding:6px 0 6px 12px;margin-bottom:6px;}
  .history-outcome{font-size:13.5px;font-weight:700;}
  .history-meta{font-size:12px;color:var(--text-soft);}
  .history-notes{font-size:13px;color:var(--text);margin-top:2px;}

  /* Outcome form */
  .outcome-form{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  select, textarea{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);font-size:14px;font-family:inherit;color:var(--text);margin-bottom:8px;
  }
  textarea{resize:vertical;min-height:56px;}
  label{font-size:12.5px;font-weight:700;color:var(--text-soft);display:block;margin-bottom:5px;}

  /* Today's list */
  .list-item{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;
  }
  .list-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .list-name{font-weight:800;font-size:15px;}
  .list-sub{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
  .list-actions{display:flex;gap:8px;margin-top:10px;}
  .list-actions .btn{flex:1;padding:10px;font-size:13px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:12px 20px;border-radius:100px;
    font-size:13.5px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.2);
    opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cre-field{margin-bottom:14px;}
  .cre-field input{width:100%;}
</style>
</head>

    <div>
      <div class="brand-name">Gobyk CRE</div>
      <div class="brand-sub">Caller ID &amp; Call List</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="search">Search</button>
    <button class="tab" data-tab="today">Today's List</button>
  </div>

  <main>

    <!-- SEARCH VIEW -->
    <section class="view active" id="view-search">
      <div class="cre-field">
        <label for="creName">Your name (optional, tags your call logs)</label>
        <input type="text" id="creName" placeholder="e.g. CRE2 or your name">
      </div>

      <div class="search-row">
        <input type="tel" id="searchInput" placeholder="Enter mobile number" inputmode="numeric">
        <button class="btn btn-primary" id="searchBtn">Search</button>
      </div>
      <p class="hint">Type any 10-digit number to pull up the customer's vehicle, service status and past call notes.</p>

      <div id="searchResults"></div>
    </section>

    <!-- TODAY'S LIST VIEW -->
    <section class="view" id="view-today">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <p class="hint" style="margin:0;">Today's overdue-service batch</p>
        <button class="btn btn-outline" id="refreshListBtn" style="padding:8px 12px;font-size:12.5px;">Refresh</button>
      </div>
      <div id="todayListContainer"><div class="empty">Loading...</div></div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  // ====== CONFIG ======
  const API_URL = "https://script.google.com/macros/s/AKfycby1yjjaEhbHjH8EG5VlsYNTGfBDl-aJUnx0DGz6VPBvDtBM0jn3th6Y5p3VnRBrigNg/exec";

  // ====== State / helpers ======
  const $ = (sel) => document.querySelector(sel);
  const creInput = $('#creName');
  creInput.value = localStorage.getItem('cre_name') || '';
  creInput.addEventListener('input', () => localStorage.setItem('cre_name', creInput.value));

  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  async function apiCall(payload){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function overdueBadge(days){
    days = Number(days) || 0;
    if(days >= 271) return `<span class="badge badge-red">${days} days overdue</span>`;
    if(days >= 181) return `<span class="badge badge-amber">${days} days overdue</span>`;
    return `<span class="badge badge-green">${days} days overdue</span>`;
  }

  function telLink(mobile){
    const clean = String(mobile).replace(/\D/g,'');
    return `tel:${clean}`;
  }

  // ====== Tabs ======
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      tab.classList.add('active');
      $('#view-'+tab.dataset.tab).classList.add('active');
      if(tab.dataset.tab === 'today') loadTodayList();
    });
  });

  // ====== SEARCH ======
  $('#searchBtn').addEventListener('click', doSearch);
  $('#searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

  async function doSearch(){
    const mobile = $('#searchInput').value.trim();
    const results = $('#searchResults');
    if(mobile.replace(/\D/g,'').length < 10){
      results.innerHTML = `<div class="empty">Enter a valid 10-digit number.</div>`;
      return;
    }
    const btn = $('#searchBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>`;
    results.innerHTML = '';
    try{
      const data = await apiCall({ action:'lookup', mobile });
      if(!data.found){
        results.innerHTML = `<div class="empty">No customer found for this number.</div>`;
      } else {
        renderCustomerCard(data.customer);
      }
    } catch(err){
      results.innerHTML = `<div class="empty">Couldn't reach the server. Check your connection and try again.</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }

  function renderCustomerCard(c){
    const historyHtml = (c.callHistory && c.callHistory.length)
      ? c.callHistory.map(h => `
          <div class="history-item">
            <div class="history-outcome">${h.outcome || '—'} <span class="history-meta">· ${h.direction || ''}</span></div>
            <div class="history-meta">${h.cre ? h.cre + ' · ' : ''}${formatDate(h.timestamp)}</div>
            ${h.notes ? `<div class="history-notes">${escapeHtml(h.notes)}</div>` : ''}
          </div>`).join('')
      : `<div class="hint" style="margin:0;">No previous calls logged for this number.</div>`;

    $('#searchResults').innerHTML = `
      <div class="card" id="custCard">
        <div class="card-top">
          <div>
            <p class="cust-name">${escapeHtml(c.customerName) || 'Name not on file'}</p>
            <div class="cust-sub">${escapeHtml(c.vehicleModel)} · ${escapeHtml(c.vehicleNumber)}</div>
          </div>
          ${overdueBadge(c.daysOverdue)}
        </div>

        <div class="info-grid">
          <div class="info-item"><div class="info-label">Branch</div><div class="info-value">${escapeHtml(c.branch)}</div></div>
          <div class="info-item"><div class="info-label">Last Service</div><div class="info-value">${escapeHtml(formatDate(c.lastServiceDate))}</div></div>
          <div class="info-item"><div class="info-label">Status</div><div class="info-value">${escapeHtml(c.status) || '—'}</div></div>
          <div class="info-item"><div class="info-label">Attempts</div><div class="info-value">${c.attemptCount || 0}</div></div>
        </div>
        ${c.remarks ? `<div class="info-item" style="margin-top:2px;"><div class="info-label">Remarks</div><div class="info-value" style="font-weight:600;">${escapeHtml(c.remarks)}</div></div>` : ''}

        <div class="action-row">
          <a class="btn btn-primary" style="text-align:center;text-decoration:none;" href="${telLink(c.mobile)}" onclick="logDial('${c.mobile}','${escapeAttr(c.customerName)}','${escapeAttr(c.vehicleNumber)}','Outbound')">Call ${c.mobile}</a>
          <button class="btn btn-outline" onclick="toggleOutcomeForm()">Log Outcome</button>
        </div>

        <div class="outcome-form" id="outcomeForm" style="display:none;">
          <label>Outcome</label>
          <select id="outcomeSelect">
            <option>Reached - Interested</option>
            <option>Reached - Not Interested</option>
            <option>No Answer</option>
            <option>Callback Requested</option>
            <option>Wrong Number</option>
            <option>Switched Off</option>
          </select>
          <label>Notes</label>
          <textarea id="outcomeNotes" placeholder="Any notes from the call..."></textarea>
          <button class="btn btn-primary btn-block" onclick="saveOutcome('${c.mobile}','${escapeAttr(c.customerName)}','${escapeAttr(c.vehicleNumber)}')">Save Call Log</button>
        </div>

        <div class="history-title">Call History</div>
        ${historyHtml}
      </div>
    `;
  }

  function toggleOutcomeForm(){
    const f = $('#outcomeForm');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  }

  window.logDial = async function(mobile, name, vehicle, direction){
    // Fire-and-forget log entry the moment they tap to call
    try{
      await apiCall({
        action:'logCall', cre: creInput.value, mobile, customerName: name,
        vehicleNumber: vehicle, direction, outcome:'Dialed', notes:''
      });
    }catch(e){ /* silent - call still goes through even if logging fails */ }
  };

  window.saveOutcome = async function(mobile, name, vehicle){
    const outcome = $('#outcomeSelect').value;
    const notes = $('#outcomeNotes').value;
    try{
      await apiCall({
        action:'logCall', cre: creInput.value, mobile, customerName: name,
        vehicleNumber: vehicle, direction:'Outbound', outcome, notes
      });
      showToast('Call logged');
      $('#outcomeNotes').value = '';
      doSearch(); // refresh card with updated history
    }catch(e){
      showToast('Could not save - try again');
    }
  };

  // ====== TODAY'S LIST ======
  $('#refreshListBtn').addEventListener('click', loadTodayList);

  async function loadTodayList(){
    const container = $('#todayListContainer');
    container.innerHTML = `<div class="empty">Loading...</div>`;
    try{
      const data = await apiCall({ action:'todayList', cre: '' });
      if(!data.list || !data.list.length){
        container.innerHTML = `<div class="empty">No calls in today's batch.</div>`;
        return;
      }
      container.innerHTML = data.list.map(item => `
        <div class="list-item">
          <div class="list-item-top">
            <div>
              <div class="list-name">${escapeHtml(item.customerName) || 'Name not on file'}</div>
              <div class="list-sub">${escapeHtml(item.vehicleModel)} · ${escapeHtml(item.vehicleNumber)}</div>
              <div class="list-sub">${escapeHtml(item.branch)}${item.assignedTo ? ' · ' + escapeHtml(item.assignedTo) : ''}</div>
            </div>
            ${overdueBadge(item.daysOverdue)}
          </div>
          <div class="list-actions">
            <a class="btn btn-primary" style="text-align:center;text-decoration:none;" href="${telLink(item.mobile)}" onclick="logDial('${item.mobile}','${escapeAttr(item.customerName)}','${escapeAttr(item.vehicleNumber)}','Outbound')">Call ${item.mobile}</a>
            <button class="btn btn-outline" onclick="quickLog('${item.mobile}','${escapeAttr(item.customerName)}','${escapeAttr(item.vehicleNumber)}')">Log</button>
          </div>
        </div>
      `).join('');
    } catch(err){
      container.innerHTML = `<div class="empty">Couldn't load the list. Check your connection.</div>`;
    }
  }

  window.quickLog = function(mobile, name, vehicle){
    // Jump to search tab with this number pre-filled and outcome form open
    document.querySelector('.tab[data-tab="search"]').click();
    $('#searchInput').value = mobile;
    doSearch().then(()=>{
      setTimeout(()=>{ const f = $('#outcomeForm'); if(f) f.style.display='block'; }, 300);
    });
  };

  // ====== Utils ======
  function formatDate(val){
    if(!val) return '—';
    const d = new Date(val);
    if(isNaN(d)) return String(val);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }
  function escapeHtml(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str){
    return escapeHtml(str).replace(/'/g, "&#39;");
  }
</script>
